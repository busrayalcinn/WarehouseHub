services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: warehousehub-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Warehouse_Passw0rd!"
    ports:
      - "14333:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: warehousehub-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: warehousehub-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: warehouse
      RABBITMQ_DEFAULT_PASS: "Warehouse_Passw0rd!"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/WarehouseHub.Api/Dockerfile
    container_name: warehousehub-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__WarehouseDb: "Server=sqlserver,1433;Database=WarehouseHub;User Id=sa;Password=Warehouse_Passw0rd!;TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__RabbitMq: "amqp://warehouse:Warehouse_Passw0rd!@rabbitmq:5672"
      Database__MigrateOnStartup: "true"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/WarehouseHub.Worker/Dockerfile
    container_name: warehousehub-worker
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__RabbitMq: "amqp://warehouse:Warehouse_Passw0rd!@rabbitmq:5672"
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  sqldata:
