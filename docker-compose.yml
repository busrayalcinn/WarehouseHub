services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: warehousehub-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Warehouse_Passw0rd!"
    ports:
      - "14333:1433"
    volumes:
      - sqldata:/var/opt/mssql

  redis:
    image: redis:7-alpine
    container_name: warehousehub-redis
    ports:
      - "6379:6379"

volumes:
  sqldata:
